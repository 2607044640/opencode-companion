<!doctype html>
<html lang="zh-CN" class="dark h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Web Companion</title>
  </head>
  <body class="bg-[#0c0d0e] text-[#e6edf3] h-full overflow-hidden">
    <div id="root" class="h-full w-full overflow-hidden flex flex-col">
      <style>
        @keyframes oc-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes oc-float {
          0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
          40% { transform: translateY(-6px); opacity: 1; }
        }
        .oc-boot-wrap {
          height: 100%;
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #0c0d0e;
          color: #e4e4e7;
          font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
          user-select: none;
        }
        .oc-boot-ring-box {
          position: relative;
          width: 56px;
          height: 56px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 16px;
        }
        .oc-boot-ring {
          position: absolute;
          inset: 0;
          border-radius: 9999px;
          border: 2.5px solid rgba(249, 115, 22, 0.18);
          border-top-color: #fb923c;
          border-right-color: #a855f7;
          animation: oc-spin 0.9s linear infinite;
        }
        .oc-boot-dots {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-top: 10px;
        }
        .oc-boot-dot {
          width: 6px;
          height: 6px;
          border-radius: 9999px;
          background: #fb923c;
          animation: oc-float 1.1s ease-in-out infinite;
        }
      </style>
      <div class="oc-boot-wrap">
        <div class="oc-boot-ring-box">
          <div class="oc-boot-ring"></div>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div style="font-size: 16px; font-weight: 600; color: #e4e4e7;">OpenCode Companion</div>
        <div style="font-size: 12px; color: #a1a1aa; margin-top: 4px;">正在加载工作区与对话数据…</div>
        <div class="oc-boot-dots">
          <span class="oc-boot-dot" style="animation-delay: 0ms;"></span>
          <span class="oc-boot-dot" style="animation-delay: 160ms; background: #c084fc;"></span>
          <span class="oc-boot-dot" style="animation-delay: 320ms;"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
