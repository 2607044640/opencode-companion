<!doctype html>
<html lang="zh-CN" class="dark h-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCode Web Companion</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0d0e" />
    <script>
      (function() {
        try {
          var isPwa = window.matchMedia('(display-mode: standalone)').matches ||
                      window.matchMedia('(display-mode: window-controls-overlay)').matches ||
                      window.matchMedia('(display-mode: minimal-ui)').matches ||
                      window.matchMedia('(display-mode: fullscreen)').matches ||
                      (window.locationbar && !window.locationbar.visible) ||
                      sessionStorage.getItem('opencode_is_pwa') === '1';

          if (isPwa) {
            sessionStorage.setItem('opencode_is_pwa', '1');
            return;
          }

          var params = new URLSearchParams(window.location.search);
          var sid = params.get('session');
          if (sid && params.get('view') !== 'web') {
            fetch('/api/focus-app?session=' + encodeURIComponent(sid)).catch(function() {});
            try {
              window.opener = null;
              window.open('', '_self');
              window.close();
            } catch (e) {}
            setTimeout(function() {
              try { window.close(); } catch (e) {}
            }, 150);

            window.addEventListener('DOMContentLoaded', function() {
              if (document.body) {
                var safeSid = sid.replace(/[^a-zA-Z0-9_-]/g, '');
                document.body.innerHTML = '<div style="background:#0c0d0e;color:#e2e8f0;font-family:-apple-system,BlinkMacSystemFont,\'Segoe UI\',Roboto,sans-serif;margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:24px;box-sizing:border-box;"><div style="background:#16181d;border:1px solid #27272a;border-radius:12px;padding:32px 36px;max-width:420px;box-shadow:0 10px 25px -5px rgba(0,0,0,0.5);"><div style="font-size:36px;margin-bottom:12px;">🚀</div><h2 style="margin:0 0 8px 0;font-size:18px;font-weight:600;color:#f4f4f5;">已唤起 OpenCode5173</h2><p style="margin:0 0 20px 0;font-size:14px;color:#a1a1aa;line-height:1.5;">已在桌面应用中打开会话 (' + safeSid + ')。<br>此网页标签可直接关闭。</p><button style="display:inline-block;background:#f97316;color:#ffffff;padding:8px 20px;border-radius:6px;font-size:14px;font-weight:500;border:none;cursor:pointer;" onclick="window.close()">关闭此标签</button><div style="margin-top:14px;"><a style="color:#71717a;font-size:12px;text-decoration:underline;" href="' + window.location.pathname + '?session=' + encodeURIComponent(sid) + '&view=web">在网页中继续使用</a></div></div></div>';
              }
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0c0d0e] text-[#e6edf3] h-full overflow-hidden">
    <div id="root" class="h-full w-full overflow-hidden flex flex-col">
      <style>
        @keyframes oc-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes oc-float {
          0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
          40% { transform: translateY(-6px); opacity: 1; }
        }
        .oc-boot-wrap {
          height: 100%;
          width: 100%;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #0c0d0e;
          color: #e4e4e7;
          font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
          user-select: none;
        }
        .oc-boot-ring-box {
          position: relative;
          width: 56px;
          height: 56px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 16px;
        }
        .oc-boot-ring {
          position: absolute;
          inset: 0;
          border-radius: 9999px;
          border: 2.5px solid rgba(249, 115, 22, 0.18);
          border-top-color: #fb923c;
          border-right-color: #a855f7;
          animation: oc-spin 0.9s linear infinite;
        }
        .oc-boot-dots {
          display: flex;
          align-items: center;
          gap: 6px;
          margin-top: 10px;
        }
        .oc-boot-dot {
          width: 6px;
          height: 6px;
          border-radius: 9999px;
          background: #fb923c;
          animation: oc-float 1.1s ease-in-out infinite;
        }
      </style>
      <div class="oc-boot-wrap">
        <div class="oc-boot-ring-box">
          <div class="oc-boot-ring"></div>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fb923c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div style="font-size: 16px; font-weight: 600; color: #e4e4e7;">OpenCode Companion</div>
        <div style="font-size: 12px; color: #a1a1aa; margin-top: 4px;">正在加载工作区与对话数据…</div>
        <div class="oc-boot-dots">
          <span class="oc-boot-dot" style="animation-delay: 0ms;"></span>
          <span class="oc-boot-dot" style="animation-delay: 160ms; background: #c084fc;"></span>
          <span class="oc-boot-dot" style="animation-delay: 320ms;"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        let lastHandledTs = Date.now();
        async function checkNavIntent() {
          try {
            const res = await fetch('/api/active-session');
            if (res.ok) {
              const data = await res.json();
              if (data && data.sessionId && data.ts > lastHandledTs) {
                lastHandledTs = data.ts;
                window.dispatchEvent(new CustomEvent('switch-session', { detail: { sessionID: data.sessionId } }));
                const url = new URL(window.location.href);
                url.searchParams.set('session', data.sessionId);
                window.history.pushState({}, '', url.toString());
              }
            }
          } catch (e) {}
        }
        setInterval(checkNavIntent, 600);
        window.addEventListener('focus', checkNavIntent);
      })();
    </script>
  </body>
</html>
